<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Chat Smith 2API Demo</title>
<style>
  body{font-family:system-ui,-apple-system,sans-serif;max-width:760px;margin:24px auto;padding:0 16px;background:#0f1117;color:#e6e6e6}
  h1{font-size:20px} h1 span{color:#7aa2f7;font-size:12px;font-weight:normal}
  #chat{border:1px solid #2a2d3a;border-radius:10px;height:480px;overflow-y:auto;padding:16px;background:#161822}
  .msg{margin:8px 0;padding:10px 14px;border-radius:10px;max-width:85%;white-space:pre-wrap;word-break:break-word;line-height:1.5}
  .user{background:#2b3a67;margin-left:auto} .bot{background:#22242f}
  .meta{font-size:11px;color:#666;margin-top:6px}
  .row{display:flex;gap:8px;margin-top:12px}
  input,select,button{background:#1b1e2b;color:#e6e6e6;border:1px solid #2a2d3a;border-radius:8px;padding:10px 12px;font-size:14px}
  input{flex:1} button{cursor:pointer} button:hover{background:#2a2d3a}
  select{max-width:200px}
</style>
</head>
<body>
<h1>🔓 Chat Smith 2API Demo <span>vulcanlabs.co · smith-v2 逆向 · demo_server.py :8903</span></h1>
<div id="chat"></div>
<div class="row">
  <select id="model">
    <option value="gpt-4o-mini" selected>gpt-4o-mini</option>
    <option value="gpt-4o">gpt-4o</option>
    <option value="gpt-5">gpt-5</option>
    <option value="gpt-5.2">gpt-5.2</option>
    <option value="o3">o3</option>
    <option value="gemini-2.5-pro">gemini-2.5-pro</option>
    <option value="gemini-3-pro-preview">gemini-3-pro-preview</option>
    <option value="deepseek-reasoner">deepseek-reasoner</option>
    <option value="grok-4">grok-4</option>
  </select>
  <input id="q" placeholder="输入消息…" autofocus>
  <button onclick="send()">发送</button>
</div>
<script>
const chat = document.getElementById('chat');
const q = document.getElementById('q');
let msgs = [];
function add(cls, text, meta) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  if (meta) { const m = document.createElement('div'); m.className='meta'; m.textContent=meta; d.appendChild(m); }
  chat.appendChild(d); chat.scrollTop = chat.scrollHeight;
  return d;
}
async function send() {
  const text = q.value.trim(); if (!text) return;
  q.value = '';
  msgs.push({role:'user', content:text});
  add('user', text);
  const model = document.getElementById('model').value;
  const bubble = add('bot', '…');
  const t0 = performance.now();
  try {
    const r = await fetch('/v1/chat/completions', {method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({model, messages: msgs})});
    const j = await r.json();
    if (j.error) { bubble.textContent = '⚠ ' + (j.error.message||JSON.stringify(j.error)); return; }
    const c = j.choices[0].message.content;
    msgs.push({role:'assistant', content:c});
    bubble.textContent = c;
    bubble.insertAdjacentHTML('beforeend',
      `<div class="meta">${j.model} · ${j.usage?.total_tokens??'?'} tok · ${Math.round(performance.now()-t0)}ms</div>`);
  } catch (e) { bubble.textContent = '⚠ ' + e.message; }
}
q.addEventListener('keydown', e => { if (e.key==='Enter') send(); });
add('bot', 'Chat Smith 2API 已就绪。上游: api.vulcanlabs.co/smith-v2 (免费 JWT 鉴权链已还原)。选模型开始对话。');
</script>
</body>
</html>
